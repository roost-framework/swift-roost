name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      spectro_ref:
        description: Spectro revision for ecosystem acceptance
        default: "2.1.0"
      nexus_ref:
        description: Nexus revision for ecosystem acceptance
        default: "2.0.0"
      esw_ref:
        description: ESW revision for ecosystem acceptance
        default: "1.5.0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the macOS SDK
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Import Swift signing keys
        if: runner.os == 'Linux'
        run: curl --fail --silent --show-error --location --compressed --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --import
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.3.3"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Test against published dependency versions
        run: swift test

  generated-app:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          path: Roost
      - uses: actions/checkout@v4
        with:
          repository: Spectro-ORM/Spectro
          ref: ${{ inputs.spectro_ref || '2.1.0' }}
          path: Spectro
      - uses: actions/checkout@v4
        with:
          repository: Spectro-ORM/Nexus
          ref: ${{ inputs.nexus_ref || '2.0.0' }}
          path: Nexus
      - uses: actions/checkout@v4
        with:
          repository: Spectro-ORM/ESW
          ref: ${{ inputs.esw_ref || '1.5.0' }}
          path: esw
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --import
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.3.3"
      - name: Install PostgreSQL client tools and system dependencies
        run: sudo apt-get update && sudo apt-get install -y postgresql-client zlib1g-dev
      - name: Record ecosystem revisions
        run: |
          git -C Roost rev-parse HEAD
          git -C Spectro rev-parse HEAD
          git -C Nexus rev-parse HEAD
          git -C esw rev-parse HEAD
      - name: Generate, migrate, test and exercise a Linux release
        working-directory: Roost
        run: python3 scripts/check_generated_app.py --ecosystem .. --release --work-dir "$RUNNER_TEMP/roost-acceptance"
      - name: Keep acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-app-logs
          path: ${{ runner.temp }}/roost-acceptance/*.log
