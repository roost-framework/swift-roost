name: Roost website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "Sources/**"
      - "Documentation/**"
      - "scripts/build_docs.py"
      - "Package.swift"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript and local links
        run: |
          node --check website/script.js
          node --check website/playground/app.mjs
          node --check website/playground/examples.mjs
          node --test website/playground/examples.test.mjs
          python3 website/check.py

  # The site is one Pages artifact, so every deploy must carry the docs too.
  # Builds on pushes to main and manual runs (for a dry run from any branch), not on PRs.
  docs:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select the newest installed Xcode
        run: echo "DEVELOPER_DIR=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)/Contents/Developer" >> "$GITHUB_ENV"
      - name: Require a Swift 6.3 or newer DocC toolchain
        run: swift --version | grep -Eq "Swift version 6\.[3-9]"
      - name: Build documentation for the Pages subpath
        run: python3 scripts/build_docs.py --hosting-base-path /swift-roost/docs --output "$RUNNER_TEMP/Roost-Pages.doccarchive"
      - uses: actions/upload-artifact@v4
        with:
          name: roost-docs
          path: ${{ runner.temp }}/Roost-Pages.doccarchive

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site/playground
          cp website/index.html website/404.html website/playground.html website/style.css website/playground.css website/script.js website/robots.txt website/sitemap.xml website/.nojekyll _site/
          cp website/playground/app.mjs website/playground/examples.mjs _site/playground/
          cp -R website/assets _site/assets
      - uses: actions/download-artifact@v4
        with:
          name: roost-docs
          path: _site/docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
